<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexiBridge Subtitle Generator</title>
  <link rel="stylesheet" href="subtitles.css">
</head>
<body>
  <div class="subtitle-page">
    <header class="page-header">
      <div>
        <span class="brand-name">LexiBridge</span>
        <h1>Subtitle generator</h1>
      </div>
      <button id="openSettings" class="icon-button" type="button" title="Provider settings" aria-label="Provider settings">&#9881;</button>
    </header>

    <main>
      <section class="file-band" aria-label="Media file">
        <div class="source-actions">
          <label class="file-picker">
            <span>Choose media</span>
            <input id="mediaFile" type="file" accept=".flac,.mp3,.mp4,.mpeg,.mpga,.m4a,.ogg,.wav,.webm,audio/flac,audio/mpeg,audio/mp4,audio/ogg,audio/x-m4a,audio/wav,audio/x-wav,audio/webm,video/mp4,video/webm">
          </label>
          <button id="toggleTabCapture" class="secondary-button capture-button" type="button" disabled>Capture current tab</button>
          <button id="generateWaveform" class="secondary-button" type="button" disabled>Generate waveform</button>
          <button id="cancelTabCapture" class="icon-button icon-button-dark" type="button" title="Cancel tab capture" aria-label="Cancel tab capture" hidden>&#10005;</button>
        </div>
        <div class="file-summary">
          <strong id="fileName">No media selected</strong>
          <span id="fileDetails">Local audio/video or current tab, up to 25 MB</span>
        </div>
      </section>

      <section id="waveformPanel" class="waveform-band" aria-label="Audio waveform" hidden>
        <div class="waveform-header">
          <strong>Waveform</strong>
          <span id="waveformSummary"></span>
        </div>
        <canvas id="audioWaveform" width="1200" height="160"></canvas>
      </section>

      <section class="control-band" aria-label="Subtitle generation settings">
        <label>
          Speech service
          <select id="transcriptionProvider"></select>
        </label>
        <label>
          Speech model
          <select id="transcriptionModel"></select>
        </label>
        <label>
          Spoken language
          <select id="sourceLanguage"></select>
        </label>
        <label class="prompt-control">
          Vocabulary or context
          <input id="transcriptionPrompt" type="text" maxlength="1000" placeholder="Optional names and specialist terms">
        </label>
        <label class="toggle-control">
          <input id="translateCaptions" type="checkbox" checked>
          <span>Translate captions</span>
        </label>
        <label>
          Translation service
          <select id="translationProvider"></select>
        </label>
        <label>
          Translate to
          <select id="targetLanguage"></select>
        </label>
      </section>

      <section class="run-band" aria-label="Generation progress">
        <div class="progress-copy">
          <strong id="generationStatus" role="status" aria-live="polite">Ready</strong>
          <span id="progressText">0%</span>
        </div>
        <progress id="generationProgress" max="100" value="0"></progress>
        <div class="run-actions">
          <button id="cancelGeneration" class="secondary-button" type="button" hidden>Cancel</button>
          <button id="generateSubtitles" class="primary-button" type="button" disabled>Generate subtitles</button>
        </div>
        <p id="partialTranscript" class="partial-transcript" aria-live="polite" hidden></p>
      </section>

      <section id="resultSection" class="result-section" hidden>
        <div class="result-header">
          <div>
            <h2>Generated captions</h2>
            <p id="resultSummary"></p>
          </div>
          <div class="result-actions">
            <button id="clearResult" class="icon-button icon-button-dark" type="button" title="Clear captions" aria-label="Clear captions">&#10005;</button>
            <button id="exportSrt" class="secondary-button" type="button">Export SRT</button>
            <button id="exportVtt" class="secondary-button" type="button">Export VTT</button>
            <button id="applyToSourceVideo" class="secondary-button" type="button" hidden disabled>Apply to source video</button>
            <button id="clearSourceVideo" class="icon-button icon-button-dark" type="button" title="Clear source video subtitles" aria-label="Clear source video subtitles" hidden disabled>&#10005;</button>
          </div>
        </div>
        <div id="cueEditToolbar" class="cue-edit-toolbar" hidden>
          <label class="timeline-shift-field" for="timelineShift">
            <span>Shift all captions (seconds)</span>
            <input id="timelineShift" type="number" step="0.001" value="0">
          </label>
          <button id="applyTimelineShift" class="secondary-button" type="button">Apply shift</button>
          <label class="timeline-shift-field" for="timelineFrameRate">
            <span>Frame rate</span>
            <select id="timelineFrameRate">
              <option value="">Off</option>
            </select>
          </label>
          <button id="snapTimelineToFrames" class="secondary-button" type="button" disabled>Snap to frames</button>
          <div class="timeline-history-actions">
            <button id="undoTimelineEdit" class="icon-button icon-button-dark" type="button" title="Undo caption edit" aria-label="Undo caption edit" disabled>&#8630;</button>
            <button id="redoTimelineEdit" class="icon-button icon-button-dark" type="button" title="Redo caption edit" aria-label="Redo caption edit" disabled>&#8631;</button>
          </div>
        </div>
        <div id="timelineOverview" class="timeline-overview" hidden>
          <div class="timeline-scale" aria-hidden="true">
            <span>00:00</span>
            <span id="timelineDuration">00:00</span>
          </div>
          <div id="timelineTrack" class="timeline-track" role="group" aria-label="Generated caption timeline"></div>
        </div>
        <div id="cueList" class="cue-list"></div>
      </section>
    </main>
  </div>

  <script src="subtitles.js"></script>
</body>
</html>
