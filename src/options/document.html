<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Translator - LexiBridge Translate</title>
  <link rel="stylesheet" href="document.css">
</head>
<body>
  <div class="document-page">
    <header class="document-header">
      <div>
        <h1>Document Translator</h1>
        <p id="sourceUrlInfo" class="source-url" hidden></p>
      </div>
      <button id="openOptions" class="secondary-btn">Settings</button>
    </header>

    <main class="document-main">
      <section class="document-toolbar" aria-label="Document translation controls">
        <label>
          Target
          <select id="targetLanguage"></select>
        </label>
        <label>
          Provider
          <select id="translationProvider"></select>
        </label>
        <label>
          Display
          <select id="displayMode">
            <option value="bilingual">Bilingual</option>
            <option value="translation-only">Translation only</option>
            <option value="original-only">Original only</option>
          </select>
        </label>
        <label>
          Image and PDF OCR language
          <select id="ocrLanguage"></select>
        </label>
        <label>
          Scan cleanup
          <select id="pdfScanPreprocessing">
            <option value="none">None</option>
            <option value="grayscale">Grayscale + contrast</option>
            <option value="binarize">High-contrast binary</option>
          </select>
        </label>
        <label class="checkbox-control">
          <input id="pdfMixedLanguageOcr" type="checkbox">
          Mixed-language OCR
        </label>
      </section>

      <section class="document-input">
        <div class="input-actions">
          <label class="file-picker">
            <input id="documentFile" type="file" accept=".txt,.md,.markdown,.html,.htm,.json,.docx,.epub,.mobi,.azw3,.srt,.vtt,.ass,.ssa,.pdf,text/plain,text/markdown,text/html,application/xhtml+xml,application/json,text/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/epub+zip,application/x-mobipocket-ebook,application/pdf">
            Choose file
          </label>
          <button id="translateDocument" class="primary-btn">Translate document</button>
          <button id="saveDocumentHistory" class="secondary-btn" disabled>Save history</button>
          <button id="exportSubtitleFile" class="secondary-btn" disabled>Export subtitles</button>
          <button id="exportJsonFile" class="secondary-btn" disabled>Export JSON</button>
          <button id="exportDocxFile" class="secondary-btn" disabled>Export DOCX</button>
          <button id="exportEpubFile" class="secondary-btn" disabled>Export EPUB</button>
          <button id="exportPdfFile" class="secondary-btn" disabled>Export PDF</button>
          <label id="preservePdfInteractionsControl" class="checkbox-control export-option" hidden>
            <input id="preservePdfInteractions" type="checkbox">
            Preserve PDF forms, links, and annotations
          </label>
          <button id="exportTextFile" class="secondary-btn" disabled>Export text</button>
          <button id="exportResearchNote" class="secondary-btn" disabled>Export research note</button>
          <button id="exportBabelDocGuide" class="secondary-btn" type="button" hidden disabled>Export BabelDOC guide</button>
          <button id="clearDocument" class="secondary-btn">Clear</button>
        </div>
        <textarea id="sourceText" placeholder="Paste document text or load a PDF, HTML, JSON, DOCX, EPUB, MOBI, AZW3, SRT, VTT, ASS, or SSA file."></textarea>
        <p id="documentMessage" class="document-message" role="status"></p>
      </section>

      <section class="document-progress" aria-label="Translation progress">
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <span id="progressText">0 blocks</span>
      </section>

      <section class="document-batch" aria-label="Batch document translation">
        <header class="batch-header">
          <h2>Batch translation</h2>
          <label>
            Parallel files
            <select id="batchConcurrency">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
            </select>
          </label>
        </header>
        <div class="batch-actions">
          <label class="file-picker">
            <input id="batchDocumentFiles" type="file" multiple accept=".txt,.md,.markdown,.html,.htm,.json,.docx,.epub,.mobi,.azw3,.srt,.vtt,.ass,.ssa,.pdf,text/plain,text/markdown,text/html,application/xhtml+xml,application/json,text/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/epub+zip,application/x-mobipocket-ebook,application/pdf">
            Choose files
          </label>
          <button id="startDocumentBatch" class="primary-btn" type="button" disabled>Start batch</button>
          <button id="cancelDocumentBatch" class="secondary-btn" type="button" disabled>Cancel</button>
          <button id="retryDocumentBatch" class="secondary-btn" type="button" disabled>Queue failed</button>
          <button id="downloadDocumentBatch" class="secondary-btn" type="button" disabled>Download ZIP</button>
          <button id="clearDocumentBatch" class="secondary-btn" type="button" disabled>Clear queue</button>
        </div>
        <p id="batchDocumentSummary" class="batch-summary">No files queued</p>
        <p id="batchDocumentMessage" class="document-message" role="status"></p>
        <div id="batchDocumentQueue" class="batch-queue"></div>
      </section>

      <section class="document-history" aria-label="Local document translation history">
        <header class="history-header">
          <h2>History</h2>
          <label class="history-retention">
            Keep
            <select id="historyRetention">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
            </select>
          </label>
          <button id="clearDocumentHistory" class="secondary-btn" type="button" disabled>Clear all</button>
        </header>
        <div id="documentHistoryList" class="history-list"></div>
      </section>

      <div class="document-output">
        <section id="pdfViewer" class="pdf-viewer" aria-label="PDF page preview" hidden></section>
        <section id="translationResults" class="translation-results" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <script src="document.js"></script>
</body>
</html>
